<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Tarif Kartları</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body id="sayfaGövdesi">

    <nav class="navbar navbar-expand-lg shadow-sm" id="anaMenu">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="navbar-brand fw-bold text-primary">👨‍🍳 Akıllı Tarifler</span>
            <div>
                
                <button class="btn btn-outline-secondary btn-sm" id="temaButonu">🌙 Karanlık Mod</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        
        <div id="girisEkrani" class="text-center fade-in">
            <h1 class="display-4 fw-bold mb-3">Mutfaktaki Yeni Kolaylık</h1>
            <p class="lead mb-4">Sana özel tarifleri gösterebilmemiz için adını paylaşabilir misin?</p>
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <input type="text" id="kullaniciAdi" class="form-control form-control-lg mb-3 shadow-sm" placeholder="Adınız...">
                    <button class="btn btn-primary btn-lg w-100 shadow-sm" id="baslaBtn">Mutfağa Gir ➔</button>
                </div>
            </div>
        </div>

        <div id="kategoriEkrani" class="text-center d-none fade-in">
            <h2 class="mb-4" id="hosgeldinMesaji"></h2>
            <p class="text-muted mb-4">Bugün ne pişirmek istersin?</p>
            <div class="d-flex flex-wrap justify-content-center gap-3">
                <button class="btn btn-outline-primary btn-lg kategori-btn" data-kategori="baslangic_corba">🥣 Başlangıçlar / Çorba</button>
                <button class="btn btn-outline-warning btn-lg kategori-btn" data-kategori="mezeler">🧆 Mezeler</button>
                <button class="btn btn-outline-success btn-lg kategori-btn" data-kategori="arasicaklar">🥟 Ara Sıcaklar</button>
                <button class="btn btn-outline-danger btn-lg kategori-btn" data-kategori="anayemekler">🍲 Ana Yemekler</button>
                <button class="btn btn-outline-info btn-lg kategori-btn" data-kategori="salata_yanlezzet">🥗 Salata / Yan Lezzet</button>
                <button class="btn btn-outline-dark btn-lg kategori-btn" data-kategori="tatli">🍰 Tatlı</button>
                <button class="btn btn-outline-secondary btn-lg kategori-btn" data-kategori="icecek">🥤 İçecek</button>
            </div>
            <div class="mt-5">
                <button class="btn btn-link text-muted text-decoration-none" id="kategoriGeriBtn">❮ Giriş Ekranına Dön</button>
            </div>
        </div>

        <div id="tarifEkrani" class="d-none fade-in">
            
            <div class="text-start mb-3">
                <button class="btn btn-outline-danger btn-sm px-3 shadow-sm" id="tariftenCikBtn">✖ Kategorilere Dön</button>
            </div>

            <div class="text-center mb-4">
                <h3 id="secilenTarifBaslik" class="fw-bold"></h3>
                <progress id="tarifProgress" value="0" max="100" class="w-100 shadow-sm mt-2" style="height: 15px;"></progress>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-lg border-0" id="odakKarti">
                        <img src="" class="card-img-top" id="adimGorsel" alt="Tarif Görseli" style="height: 350px; object-fit: cover;">
                        
                        <div class="card-body p-4 text-center">
                            
                            <div id="ozetAlani" class="text-start mb-4 d-none">
                                <div class="row text-center g-2 mb-4">
                                    <div class="col-3"><div class="p-2 bg-light rounded"><small class="text-muted d-block">👥 Kişilik</small><strong id="ozetPorsiyon" class="fs-6 text-dark"></strong></div></div>
                                    <div class="col-3"><div class="p-2 bg-light rounded"><small class="text-muted d-block">⏱️ Hazırlama</small><strong id="ozetHazirlama" class="fs-6 text-dark"></strong></div></div>
                                    <div class="col-3"><div class="p-2 bg-light rounded"><small class="text-muted d-block">⏳ Pişirme</small><strong id="ozetPisirme" class="fs-6 text-dark"></strong></div></div>
                                    <div class="col-3"><div class="p-2 bg-light rounded"><small class="text-muted d-block">🔥 Kalori</small><strong id="ozetKalori" class="fs-6 text-dark"></strong></div></div>
                                </div>
                                <h5 class="fw-bold text-primary mb-3">🛒 Gerekli Malzemeler</h5>
                                <ul id="ozetMalzemeler" class="fs-6 ps-3 text-dark"></ul>
                            </div>

                            <div id="adimAlani">
                                <h4 id="adimBaslik" class="card-title fw-bold text-primary mb-3"></h4>
                                <p id="adimMetin" class="card-text fs-5 mb-4"></p>
                            </div>
                            
                            <div id="sayacAlani" class="d-none mb-4 p-3 bg-light rounded">
                                <h5>⏱️ Süre: <span id="kalanSure">0</span> sn</h5>
                                <meter id="sureOlcer" min="0" max="100" value="100" class="w-100"></meter>
                            </div>

                            <details class="mb-4 text-start bg-light p-3 rounded shadow-sm border-start border-4 border-warning">
                                <summary class="fw-bold text-warning" style="cursor: pointer;">💡 Şefin İpucu</summary>
                                <p class="mt-2 mb-0 text-muted" id="adimIpucu"></p>
                            </details>
                            
                            <div class="d-flex justify-content-between mt-4">
                                <button class="btn btn-secondary px-4" id="geriBtn">❮ Geri</button>
                                <button class="btn btn-primary px-5" id="ileriBtn">Sonraki Adım ❯</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <audio id="basariSesi" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=success-1-6297.mp3"></audio>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
