<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şef Paneli - Yeni Tarif Ekle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand fw-bold text-warning">👨‍🍳 Şef Paneli</span>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-light">Ana Sayfaya Dön</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg p-4">
                    <h2 class="mb-4 text-center text-primary">Sisteme Yeni Tarif Ekle</h2>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tarif Adı</label>
                        <input type="text" id="yeniTarifAdi" class="form-control" placeholder="Örn: Mercimek Çorbası">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Kategori Seçimi</label>
                        <select id="yeniKategori" class="form-select form-control">
                            <option value="">Lütfen Bir Kategori Seçin</option>
                            <option value="baslangiclar">Başlangıçlar</option>
                            <option value="anayemekler">Ana Yemekler</option>
                            <option value="yanlezzetler">Yan Lezzetler</option>
                            <option value="tatlilar">Tatlılar</option>
                            <option value="icecekler">İçecekler</option>
                            <option value="sefonerileri">Şef Önerileri</option>
                            <option value="gununmenusu">Günün Menüsü</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">1. Adım Talimatı</label>
                        <textarea id="yeniAdimMetni" class="form-control" rows="3" placeholder="Tarifin ilk adımını detaylıca yazın..."></textarea>
                    </div>

                    <button class="btn btn-success w-100 fs-5 py-2" id="tarifKaydetBtn">Tarifi Ekle</button>
                    
                    <p id="adminMesaj" class="mt-4 text-center fs-5"></p>
                    
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
